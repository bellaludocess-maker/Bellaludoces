  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFF8FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .bella-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #3A1E14;
      text-align: center;
    }
    .bella-loader img {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(232, 93, 136, 0.25);
      animation: bellaPulse 1.4s infinite ease-in-out;
    }
    .bella-loader p {
      margin-top: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #E85D88;
    }
    @keyframes bellaPulse {
      0%, 100% { transform: scale(0.96); }
      50% { transform: scale(1.04); }
    }
  </style>

<body>
  <div class="bella-loader" id="bella-initial-loader">
